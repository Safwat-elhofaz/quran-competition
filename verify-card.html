<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f7f1">
<title>التحقق من كارت الإنجاز | صفوة الحفاظ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:#f8f7f1;color:#174b3e;font-family:Cairo,sans-serif;display:grid;place-items:center}
main{width:min(100%,520px);padding:30px 24px;border:2px solid #e5c46a;border-radius:18px;background:#fff;box-shadow:0 16px 45px #174b3e14;text-align:center}
.mark{font-size:30px;color:#b99a43}h1{margin:6px 0;color:#075443;font-size:25px}p{line-height:1.9;color:#61746c}
.result{margin:22px 0;padding:18px;border-radius:12px;background:#f3f6f2}.status{font-size:19px;font-weight:800}.valid{color:#16824f}.invalid{color:#b33b35}.name{font-size:21px;font-weight:800;color:#075443;margin:12px 0 4px}
.meta{font-size:14px;color:#63756e}.number{margin-top:18px;color:#987c34;font-weight:800;letter-spacing:3px;font-family:Arial,sans-serif}
footer{margin-top:22px;padding-top:15px;border-top:1px solid #e7dfc8;font-size:13px;color:#987c34}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
</head>
<body><main>
<div class="mark">۞</div><h1>صفوة الحفاظ</h1><p>التحقق من اعتماد كارت الإنجاز</p>
<div id="result" class="result"><p>جاري التحقق من الكارت...</p></div>
<div id="cardNumber" class="number"></div>
<footer><div class="social-links" aria-label="تابع صفوة الحفاظ">
<a class="social-link social-facebook" href="https://www.facebook.com/share/1DaL4qU6Ko/" target="_blank" rel="noopener noreferrer" aria-label="صفحة صفوة الحفاظ على فيسبوك" title="فيسبوك">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 21v-8.2h2.8l.4-3.2h-3.2V7.5c0-.9.3-1.6 1.6-1.6h1.7V3.1c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.6v2H6.8v3.2h2.9V21h3.7Z" fill="currentColor"/></svg>
</a>
<a class="social-link social-whatsapp" href="https://whatsapp.com/channel/0029VbDFYfB1CYoV1nC8U43v" target="_blank" rel="noopener noreferrer" aria-label="قناة صفوة الحفاظ على واتساب" title="قناة واتساب">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2a9.7 9.7 0 0 0-8.3 14.7L2.4 22l5.2-1.4A9.8 9.8 0 1 0 12 2.2Zm0 17.7a8 8 0 0 1-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8 8 0 1 1 12 19.9Zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.3.1-.5l.4-.4c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.5l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 3.9 3.4.5.2.9.3 1.2.4.5.2 1 .1 1.4.1.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3Z" fill="currentColor"/></svg>
</a>
</div><span>بالقرآن نرتقي، وبالإتقان نتميز</span></footer>
</main>
<script>
(async()=>{
 const box=document.getElementById("result"),number=document.getElementById("cardNumber");
 const card=new URLSearchParams(location.search).get("card")||"";
 number.textContent=card;
 if(!/^[0-9]{8}$/.test(card)){box.innerHTML='<div class="status invalid">رقم كارت غير صحيح</div><p>تأكد من مسح رمز QR الموجود على الكارت.</p>';return}
 try{
  const response=await fetch("https://rjbiahkjfmhexexssczg.supabase.co/functions/v1/public-student-gateway",{
   method:"POST",
   headers:{"apikey":"sb_publishable_4_pS_PYlIamm6eXOWzGmTg_IY0mN-oR","Content-Type":"application/json"},
   body:JSON.stringify({action:"verify",p_card_number:card})
  });
  let payload={};
  try{payload=await response.json()}catch(e){}
  if(!response.ok)throw new Error(payload.error||"تعذر الاتصال بخدمة التحقق.");
  const data=payload.data;
  if(!data)throw new Error("لم تصل نتيجة التحقق.");
  if(!data||!data.found){box.innerHTML='<div class="status invalid">الكارت غير مسجل</div><p>لم نعثر على كارت بهذا الرقم في سجلات صفوة الحفاظ.</p>';return}
  if(data.valid){
   const student=data.snapshot?.student||{};
   box.innerHTML='<div class="status valid">✓ كارت معتمد وصالح</div><div class="name">'+String(data.student_name).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))+'</div><div class="meta">كارت إنجاز صادر من مركز صفوة الحفاظ</div><div class="meta">تاريخ الإصدار: '+new Date(data.issued_at).toLocaleDateString("ar-EG")+'</div>';
  }else{
   box.innerHTML='<div class="status invalid">✕ هذا الكارت ملغي</div><p>تم إلغاء اعتماد هذا الكارت من إدارة المركز.</p><div class="name">'+String(data.student_name).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))+'</div>';
  }
 }catch(e){box.innerHTML='<div class="status invalid">تعذر التحقق حاليًا</div><p>حاول مرة أخرى بعد قليل.</p>'}
})();
</script></body></html>
